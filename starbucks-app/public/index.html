<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>☕️ My Starbucks Log</h1>
        <div class="user-switch" style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;">
            <button id="userHer" onclick="switchUser('her')" style="flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #007042; background: #007042; color: white; cursor: pointer;">きらりのログ</button>
            <button id="userMe" onclick="switchUser('me')" style="flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #ccc; background: white; color: #333; cursor: pointer;">ゆうのログ</button>
        </div>
        <input type="text" id="drinkName" placeholder="ドリンク名 (例: ホワイトモカ)">
        <input type="number" id="drinkPrice" placeholder="金額 (円)">
        <input type="number" id="drinkCalories" placeholder="カロリー (kcal)">
        <select id="drinkSize">
            <option value="Short">Short</option>
            <option value="Tall" selected>Tall</option>
            <option value="Grande">Grande</option>
            <option value="Venti">Venti</option>
        </select>
        <textarea id="memo" placeholder="カスタマイズやメモ"></textarea>
        <div class="button-group" style="display: flex; gap: 15px; align-items: center; margin-top: 10px;">
            <button id="saveBtn" style="flex: 1;">記録する</button>
            <button id="cancelBtn" onclick="cancelEdit()" style="display: none; background-color: #ccc; color: #333; flex: 1; height: 100%;">編集をキャンセル</button>
        </div>
        <div id="total-summary" style="background: #f1f8f3; padding: 15px; border-radius: 10px; margin: 20px 0; border: 1px solid #2d5e35;">
            <h3 style="margin: 0 0 10px 0; font-size: 1rem; color: #2d5e35;">☕️ 合計</h3>
            <div style="display: flex; justify-content: space-around; font-weight: bold;">
                <span>金額: <span id="totalPriceDisplay">0</span>円</span>
                <span>カロリー: <span id="totalCaloriesDisplay">0</span>kcal</span>
            </div>
        </div>
        <div style="margin-bottom: 10px; text-align: right;">
            <button id="filterBtn" onclick="toggleFilter()" style="background-color: #eee; color: #333; border: 1px solid #ccc; padding: 5px 15px; border-radius: 20px; cursor: pointer;">
                ☆ お気に入りのみ表示
            </button>
        </div>
        <hr>

        <div id="history">
            <p style="text-align: center;">読み込み中...</p>
        </div>
    </div>

    <div id="toast" class="toast">保存完了！☕️</div>
    <script type="module" src="main.js"></script>
</body>
</html>
