<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoアプリ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="todoApp">
        <h1>ToDoアプリ</h1>
        <input id="todoInput" type="text" placeholder="タスクを追加">
        <input id="deadlineInput" type="date" placeholder="締め切り日">
        <button id="addBtn">追加</button>
        <button id="clearBtn">すべて消す</button>
        <ul id="todoList"></ul>
    </div>
</body>
</html
